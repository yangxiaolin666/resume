<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生招聘平台</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <header class="header">
            <h1>大连民族大学学生招聘平台</h1>
        </header>

        <main class="main-container">
            <!-- 筛选面板 -->
            <aside class="filter-panel">
                <h2>筛选条件</h2>
                
                <div class="filter-section">
                    <h3>学历</h3>
                    <div class="filter-options">
                        <label v-for="edu in educationOptions" :key="edu">
                            <input type="checkbox" v-model="selectedFilters.education" :value="edu">
                            {{ edu }}
                        </label>
                    </div>
                </div>

                <div class="filter-section">
                    <h3>专业</h3>
                    <div class="filter-options">
                        <label v-for="major in majorOptions" :key="major">
                            <input type="checkbox" v-model="selectedFilters.majors" :value="major">
                            {{ major }}
                        </label>
                    </div>
                </div>

                <div class="filter-section">
                    <h3>技能标签</h3>
                    <div class="filter-options">
                        <label v-for="skill in skillOptions" :key="skill">
                            <input type="checkbox" v-model="selectedFilters.skills" :value="skill">
                            {{ skill }}
                        </label>
                    </div>
                </div>

                <div class="filter-section">
                    <h3>工作经验</h3>
                    <div class="filter-options">
                        <label v-for="exp in experienceOptions" :key="exp">
                            <input type="checkbox" v-model="selectedFilters.experience" :value="exp">
                            {{ exp }}
                        </label>
                    </div>
                </div>
                
                <!-- 语言掌握情况 -->
                <div class="filter-section">
                    <h3>语言掌握情况</h3>
                    <div class="filter-options">
                        <label v-for="lang in languageOptions" :key="lang">
                            <input type="checkbox" v-model="selectedFilters.languages" :value="lang">
                            {{ lang }}
                        </label>
                    </div>
                </div>
                
                <!-- 计算机专业技术证书 -->
                <div class="filter-section">
                    <h3>计算机专业技术证书</h3>
                    <div class="filter-options">
                        <label v-for="cert in certificateOptions" :key="cert">
                            <input type="checkbox" v-model="selectedFilters.certificates" :value="cert">
                            {{ cert }}
                        </label>
                    </div>
                </div>
                
                <!-- 专业实习次数 -->
                <div class="filter-section">
                    <h3>专业实习次数</h3>
                    <div class="filter-options">
                        <label v-for="intern in internshipOptions" :key="intern">
                            <input type="checkbox" v-model="selectedFilters.internships" :value="intern">
                            {{ intern }}
                        </label>
                    </div>
                </div>
                
                <!-- 计算机专业掌握情况 -->
                <div class="filter-section">
                    <h3>计算机专业掌握情况</h3>
                    <div class="filter-options">
                        <label v-for="skill in computerSkillOptions" :key="skill">
                            <input type="checkbox" v-model="selectedFilters.computerSkills" :value="skill">
                            {{ skill }}
                        </label>
                    </div>
                </div>
                
                <!-- 就业意向地区 -->
                <div class="filter-section">
                    <h3>就业意向地区</h3>
                    <div class="filter-options">
                        <label v-for="region in jobRegionOptions" :key="region">
                            <input type="checkbox" v-model="selectedFilters.jobRegions" :value="region">
                            {{ region }}
                        </label>
                    </div>
                </div>
                
                <!-- 就业岗位 -->
                <div class="filter-section">
                    <h3>就业岗位</h3>
                    <div class="filter-options">
                        <label v-for="position in jobPositionOptions" :key="position">
                            <input type="checkbox" v-model="selectedFilters.jobPositions" :value="position">
                            {{ position }}
                        </label>
                    </div>
                </div>

                <button class="reset-btn" @click="resetFilters">重置筛选</button>
            </aside>

            <div class="student-list">
                <div class="students-table-container" v-if="filteredStudents.length > 0">
                    <table class="students-table">
                        <thead>
                            <tr>
                                <th>姓名</th>
                                <th>专业</th>
                                <th>学历</th>
                                <th>工作经验</th>
                                <th>技能</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="student in filteredStudents" :key="student.id">
                                <td>{{ student.name }}</td>
                                <td>{{ student.major }}</td>
                                <td>{{ student.education }}</td>
                                <td>{{ student.experience }}</td>
                                <td>
                                    <div class="skill-tags-small">
                                        <span class="tag-small" v-for="skill in student.skills" :key="skill">{{ skill }}</span>
                                    </div>
                                </td>
                                <td>
                                    <button class="contact-btn" @click="viewStudentDetail(student)">详情</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="empty-state" v-else>
                    <p>没有找到符合条件的学生</p>
                    <button class="reset-btn" @click="resetFilters">重置筛选条件</button>
                </div>
            </div>
        </main>

        
    </div>

    <script src="app.js"></script>
</body>
</html>
