                <div style="display: flex;flex-direction: column;"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" t="1763469466651"
                     viewBox="0 0 1024 1024" version="1.1" p-id="3498" width="40" height="40" class="icon">
                    <path
                        d="M896 448h-128a32 32 0 0 0 0 64h128a32 32 0 0 0 0-64M896 320h-128a32 32 0 0 0 0 64h128a32 32 0 0 0 0-64M768 256h128a32 32 0 0 0 0-64h-128a32 32 0 0 0 0 64"
                        fill="#fff" p-id="3499" />
                    <path
                        d="M781.76 640c-5.12-2.272-97.216-42.56-198.72-62.752 11.808-9.632 22.144-20.928 31.104-33.248a174.88 174.88 0 0 0 33.792-103.2v-104.768A176.32 176.32 0 0 0 576 194.336 174.368 174.368 0 0 0 472.192 160c-96.928 0-175.776 78.976-175.776 176.032v104.768c0 56.544 26.88 106.816 68.384 139.072-96.48 20.832-181.344 57.824-185.536 59.712C150.016 651.328 128 684.192 128 716v131.712l1.728 5.024c9.504 27.904 35.136 46.624 63.776 46.624h572.992c33.28 0 60.832-24.864 64.96-56.96l0.544-126.4c0-15.232-5.184-30.72-13.664-44-9.088-14.272-21.952-26.016-36.576-32"
                        fill="#fff" p-id="3500" />
                </svg>登录</div>
                

            </div>
        </header>
        <main class="main-container">
            <aside class="filter-panel">
                <h2>筛选条件</h2>

                <div class="filter-section">
                    <h3>学历</h3>
                    <div class="filter-options">
                        <label v-for="edu in educationOptions" :key="edu">
                            <input type="radio" v-model="selectedFilters.education" :value="edu"
                                @change="handleEducationChange">
                            {{ edu }}
                        </label>
                    </div>
                </div>

                <div class="filter-section">
                    <h3>专业</h3>
                    <div class="filter-options">
                        <label v-for="major in majorOptions" :key="major">
                            <input type="checkbox" v-model="selectedFilters.majors" :value="major">
                            {{ major }}
                        </label>
                    </div>
                </div>

                <div class="filter-section">
                    <h3>技能标签</h3>
                    <div class="filter-options">
                        <label v-for="skill in skillOptions" :key="skill">
                            <input type="checkbox" v-model="selectedFilters.skills" :value="skill">
                            {{ skill }}
                        </label>
                    </div>
                </div>

                <div class="filter-section">
                    <h3>工作经验</h3>
                    <div class="filter-options">
                        <label v-for="exp in experienceOptions" :key="exp">
                            <input type="checkbox" v-model="selectedFilters.experience" :value="exp">
                            {{ exp }}
                        </label>
                    </div>
                </div>

                <!-- 语言掌握情况 -->
                <div class="filter-section">
                    <h3>语言掌握情况</h3>
                    <div class="filter-options">
                        <label v-for="lang in languageOptions" :key="lang">
                            <input type="checkbox" v-model="selectedFilters.languages" :value="lang">
                            {{ lang }}
                        </label>
                    </div>
                </div>

                <!-- 计算机专业技术证书 -->
                <div class="filter-section">
                    <h3>计算机专业技术证书</h3>
                    <div class="filter-options">
                        <label v-for="cert in certificateOptions" :key="cert">
                            <input type="checkbox" v-model="selectedFilters.certificates" :value="cert">
                            {{ cert }}
                        </label>
                    </div>
                </div>

                <!-- 专业实习次数 -->
                <div class="filter-section">
                    <h3>专业实习次数</h3>
                    <div class="filter-options">
                        <label v-for="intern in internshipOptions" :key="intern">
                            <input type="checkbox" v-model="selectedFilters.internships" :value="intern">
                            {{ intern }}
                        </label>
                    </div>
                </div>

                <!-- 计算机专业掌握情况 -->
                <div class="filter-section">
                    <h3>计算机专业掌握情况</h3>
                    <div class="filter-options">
                        <label v-for="skill in computerSkillOptions" :key="skill">
                            <input type="checkbox" v-model="selectedFilters.computerSkills" :value="skill">
                            {{ skill }}
                        </label>
                    </div>
                </div>

                <!-- 就业意向地区 -->
                <div class="filter-section">
                    <h3>就业意向地区</h3>
                    <div class="filter-options">
                        <label v-for="region in jobRegionOptions" :key="region">
                            <input type="checkbox" v-model="selectedFilters.jobRegions" :value="region">
                            {{ region }}
                        </label>
                    </div>
                </div>

                <!-- 就业岗位 -->
                <div class="filter-section">
                    <h3>就业岗位</h3>
                    <div class="filter-options">
                        <label v-for="position in jobPositionOptions" :key="position">
                            <input type="checkbox" v-model="selectedFilters.jobPositions" :value="position">
                            {{ position }}
                        </label>
                    </div>
                </div>

                <button class="reset-btn" @click="resetFilters">重置筛选</button>
            </aside>

            <div class="student-list">
                <div class="students-table-container" v-if="filteredStudents.length > 0">
                    <table class="students-table">
                        <thead>
                            <tr>
                                <th>姓名</th>
                                <th>专业</th>
                                <th>学历</th>
                                <th>工作经验</th>
                                <th>技能</th>
                                <th>详情</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="student-box" v-for="(student, index) in filteredStudents" :key="index" :data-student-id="index">
                                <td>{{ student.name }}</td>
                                <td>{{ student.major }}</td>
                                <td>{{ student.education }}</td>
                                <td>{{ student.experience }}</td>
                                <td>
                                    <div class="skill-tags-small">
                                        <span class="tag-small" v-for="skill in student.skills" :key="skill">{{ skill
                                            }}</span>
                                    </div>
                                </td>
                                <td>
                                    <button class="contact-btn" @click="viewStudentDetail(student)">详情</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="empty-state" v-else>
                    <p>没有找到符合条件的学生</p>
                    <button class="reset-btn" @click="resetFilters">重置筛选条件</button>
                </div>
            </div>
        </main>


    </div>
     
    <script src="../app.js"></script>
    <script src="index.js"></script>
    <script src="//unpkg.com/layui@2.13.0/dist/layui.js"></script>
</body>

</html>
