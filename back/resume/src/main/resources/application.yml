
server:
  port: 8081

spring:
  application:
    name: resume
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/resume
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379

knife4j:
  enable: true
  setting:
    enable-footer: false
    enable-filter-multipart-apis: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  config-location: classpath:mybatis-config.xml

# 文件上传配置
file:
  upload:
    resume-path: uploads/resume/
#    resume-path: ${user.dir}/uploads/resume/