
server:
  port: 8081

spring:
  application:
    name: resume

  mvc:
    static-path-pattern: /resume/**
  web:
    resources:
      static-locations:
        - classpath:/static/
        - classpath:/public/
        - classpath:/resources/
        - classpath:/META-INF/resources/
        - file:/resume/uploads/
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/resume
    username: root
    #password: Wangtianye123
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 8
        shutdown-timeout: 100ms
      client-type: lettuce
      retry:
        max-attempts: 3  # 最大重试次数
        initial-interval: 1000ms  # 首次重试间隔

knife4j:
  enable: true
  setting:
    enable-footer: false
    enable-filter-multipart-apis: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  config-location: classpath:mybatis-config.xml

# 文件上传配置
file:
  upload:
    resume-path: /resume/uploads/resume/
