# 对外暴露 HTTP 服务（需要集群已安装 Ingress Controller，例如 ingress-nginx）。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume-go
  namespace: recruit
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "12m" # 允许上传简历/图片
spec:
  ingressClassName: nginx
  rules:
    - host: recruit.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resume-go
                port:
                  number: 8081
